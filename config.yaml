mode: paper  # paper | demo | live

symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT

category: linear

# Investor risk limits — FROZEN for experiment window B (do not tune on Mo)
deposit_usd: 1000.0  # fallback; demo/live override from Bybit UNIFIED wallet when enabled
deposit_from_wallet: true   # demo/live: size from get_wallet_balance (USDT equity)
max_drawdown_pct: 0.10      # P — portfolio echelon-2 cap (sum of potential losses)
tf_risk_pct: 0.10           # R — exclude TF if its drawdown exceeds R
per_trade_risk_pct: 0.02    # risk-to-stop budget per single trade (NOT P/N_R)
max_leverage_frac: 1.0      # notional cap = deposit * max_leverage_frac

# Exit / vote policy (window B)
trailing_buffer_frac: 0.10  # trailing stop buffer as fraction of prev bar range
vote_min_directional: 2     # min agreeing directional TFs to enter
vote_min_margin: 2          # min (dir - opposite) margin

# Bybit linear one-way: only one net position per symbol (pick best TF)
one_position_per_symbol: true
# Poll pending stop-limit fills + exchange positions
reconcile_sec: 15

# Window B TF grid: no 15/30 (cuts turnover / cost drag)
# Do not change after experiment start without resetting the experiment.
timeframes_min: [60, 120, 240, 480, 960, 1440]

# Legacy fields kept for docs; ignored when timeframes_min is set
tf_horizon_min: 1440
tf_step_min: 15

# Kill-switch
kill_switch:
  max_orders_per_minute: 30
  max_open_positions: 20
  max_daily_loss_pct: 0.05

# Liquidity filter
min_ticks_per_sec: 0.1

# Execution cost assumptions (paper Mo)
taker_fee_bps: 5.5
slippage_bps: 5.0
funding_bps_per_8h: 1.0

# Engine
log_level: INFO
paper_replay_ticks: 5000

# Exit logic:
#   hybrid     — rule3 FLAT + trailing stop (current default)
#   book_close — Chebotarev §3 close-turn + trailing stop (no rule3 flat exit)
exit_mode: hybrid

# Honest naming
strategy_label: chebotarev_inspired_hybrid_exit

# SQLite — separate DBs so paper/demo/live bars+signals+trades never mix
db_path_paper: data/bot_paper.db
db_path_demo: data/bot_demo.db
db_path_live: data/bot_live.db
# legacy fallback (unused when mode-specific paths are set)
db_path: data/bot.db
